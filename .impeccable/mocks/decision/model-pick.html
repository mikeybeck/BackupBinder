<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>BackupBinder — Passbook</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1440px;height:900px;overflow:hidden;font-family:"Libre Franklin",system-ui,sans-serif;background:#1f2430;color:#1f2430}
  .spread{display:grid;grid-template-columns:1fr 1fr;height:100%;gap:0;padding:40px 56px}
  .cover,.page{background:#f4efe6;border:3px solid #1f2430;box-shadow:8px 8px 0 #0d1016}
  .cover{padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;background:#f4efe6 linear-gradient(90deg,#c5b8a0 0 18px,#f4efe6 18px)}
  .brand{font-size:48px;font-weight:800;letter-spacing:-.03em}
  .sub{font-size:14px;font-weight:500;color:#5a5448;margin-top:8px}
  .stamp{align-self:flex-start;border:3px solid #8b1e2d;color:#8b1e2d;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;padding:10px 14px;transform:rotate(-3deg)}
  .page{padding:40px 36px;background:repeating-linear-gradient(#f4efe6,#f4efe6 31px,#d8d0c2 32px)}
  h1{font-size:34px;font-weight:800;line-height:1.2;max-width:16ch;margin-bottom:16px;background:#f4efe6}
  .lede{font-size:16px;line-height:1.4;max-width:32ch;margin-bottom:22px;background:#f4efe6}
  .cta{display:inline-block;background:#8b1e2d;color:#f4efe6;font-weight:700;padding:12px 18px;border:3px solid #1f2430;text-decoration:none}
  table{width:100%;margin-top:28px;border-collapse:collapse;font-family:"IBM Plex Mono",monospace;font-size:12px;background:#f4efe6}
  td{padding:8px 6px;border-bottom:1px solid #1f2430}
  .ok{color:#2f6f4e;font-weight:700}
</style>
</head>
<body>
  <div class="spread">
    <aside class="cover">
      <div>
        <div class="brand">BackupBinder</div>
        <p class="sub">Site backups on this machine</p>
      </div>
      <div class="stamp">ACCOUNT OPEN</div>
    </aside>
    <main class="page">
      <h1>Keep a site archive you can actually restore.</h1>
      <p class="lede">Local-first backups for any directory. Optional remotes. Same contract for you and your agent.</p>
      <a class="cta" href="#start">Get started</a>
      <table>
        <tr><td>RUN</td><td>local</td><td class="ok">OK</td></tr>
        <tr><td>RESTORE</td><td>scratch</td><td class="ok">PROVEN</td></tr>
        <tr><td>REMOTE</td><td>optional</td><td>—</td></tr>
      </table>
    </main>
  </div>
</body>
<!-- round a6b19ae7 -->
</html>
